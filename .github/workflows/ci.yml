name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast lane: pure-Python checks that do NOT need OpenMM/Modeller/OpenBabel.
  # Runs on every push and stays under a minute.
  lint-and-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev extras only (no scientific stack)
        run: |
          # Install ruff + pytest + mypy without touching the heavy deps.
          # The lightweight subcommands (rename, puppet, split, convert)
          # don't need OpenMM/Modeller. Tests that DO need them are skipped
          # via pytest.importorskip.
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-xdist
          pip install numpy scipy biopython MDAnalysis

      - name: ruff check
        run: ruff check src/dvbfixer

      - name: pytest (fast lane, no OpenMM)
        run: |
          # Install the package itself in editable mode so `import dvbfixer` works.
          # The seed tests avoid heavy deps; anything that needs OpenBabel/OpenMM
          # is guarded with pytest.importorskip and will skip cleanly here.
          pip install --no-deps -e .
          pytest tests/ -q -m "not slow"

      # mypy is REQUIRED on the API-surface modules as of Phase 3. Everything
      # in pyproject.toml's `[tool.mypy.overrides]` list runs strict; other
      # modules are still advisory (mypy would flag hundreds of untyped defs
      # in the OpenMM/Modeller/PDBFixer callers).
      - name: mypy (API surface)
        run: mypy src/dvbfixer/cli.py src/dvbfixer/ffutils src/dvbfixer/pdbutils src/dvbfixer/align.py

      # These generators describe the public CLI and are intentionally checked
      # in the lightweight lane so fork pull requests cannot merge stale GUI
      # forms or command reference pages.
      - name: docs reference in sync with argparse
        run: python scripts/gen_cli_reference.py --check

      - name: GUI command schema in sync with argparse
        run: python scripts/gen_gui_spec.py --check

      - name: release versions in sync
        run: python scripts/check_versions.py

  # Build the public artifacts and test the wheel from a clean, dependency-free
  # environment. This catches missing entry points and package data that an
  # editable install cannot detect.
  package-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify authoritative release version
        run: python scripts/check_versions.py

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel into a clean environment
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke-test installed version, CLI, and force fields
        run: .package-smoke/bin/python scripts/smoke_distribution.py --project-root .

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dvbfixer-distributions
          path: dist/*
          if-no-files-found: error

  # Slow lane: full environment.yml with Modeller/OpenMM/OpenBabel. Skipped in
  # PRs from forks (no access to the salilab channel key). Runs on push to main
  # and PRs from the same repo.
  full-env-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          environment-name: dvbfixer
          cache-environment: true
          cache-downloads: true

      - name: Install package + dev extras
        shell: bash -el {0}
        run: |
          pip install -e ".[dev]"

      - name: pytest (full lane)
        shell: bash -el {0}
        run: pytest tests/ -q

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci --legacy-peer-deps
      - name: Lint, test, typecheck, and build GUI
        working-directory: gui
        run: |
          npm run lint
          npm test
          npm run typecheck
          npm run build
