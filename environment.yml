name: dvbfixer
channels:
  - conda-forge
  - bioconda
  - salilab
dependencies:
  - python >=3.11,<3.14
  - numpy <2.5       # mypy targets Python 3.11; NumPy 2.5 stubs require 3.12
  - scipy
  - openmm >=8.1
  - pdbfixer >=1.9
  - openmmforcefields
  - openff-toolkit
  - rdkit
  - biopython
  - gemmi >=0.7.5   # loss-aware PDBx/mmCIF -> internal PDB conversion
  - mdanalysis
  - modeller
  - parmed
  - plotly
  - hmmer
  - anarci
  - mafft            # default multiple-sequence alignment engine for the GUI
  - muscle >=5       # optional high-accuracy MSA alternative
  - clustalo         # optional scalable MSA alternative
  - nodejs >=20      # React/Node GUI under gui/
  - xtb              # GFN-FF/GFN-xTB universal FF for --xtb-refine
  - openbabel        # obminimize CLI for --obminimize-refine
  - ambertools >=23  # tleap + reduce + pdb4amber for the deterministic
                     # prep backend (dvbfixer.prep_backend). Replaces the
                     # PDBFixer.addMissingAtoms + Modeller.addHydrogens
                     # pair (both had upstream D-Cα / coincident-H bugs).
  - pip
  - pip:
    - propka >=3.5
    - acpype
    - pyscf       # QM backend for `parametrize -c resp --qm-engine pyscf`
                  # — RECOMMENDED free RESP path. Pure-Python wheels on PyPI
                  # for macOS arm64 + Linux x86_64. dvbfixer implements the
                  # AMBER 2-stage RESP-A1 fit in numpy on top of PySCF's
                  # HF/6-31G* wavefunction.

# Optional alternative RESP backend: psi4 + psiresp.
# These ship their own BLAS/MKL stack that conflicts with OpenMM's, AND
# psi4 conda-forge builds pull Python 3.9 which dvbfixer doesn't accept.
# So they live in a SEPARATE conda env; dvbfixer shells out to it via
# `micromamba run -n psi4 python ...`:
#
#   micromamba create -n psi4 -c conda-forge psi4 psiresp
#
# Fragile on macOS arm64 (libint2 SONAME mismatches). Prefer `--qm-engine
# pyscf` there. Do NOT pip-install dvbfixer in the psi4 env — dvbfixer
# stays here and invokes the psi4 env on demand. Override env name via
# --psi4-env.
