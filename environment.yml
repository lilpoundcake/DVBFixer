name: dvbfixer
channels:
  - conda-forge
  - bioconda
  - salilab
dependencies:
  - python >=3.11
  - numpy
  - scipy
  - openmm >=8.1
  - pdbfixer >=1.9
  - openmmforcefields
  - openff-toolkit
  - rdkit
  - biopython
  - mdanalysis
  - modeller
  - parmed
  - plotly
  - hmmer
  - anarci
  - xtb              # GFN-FF/GFN-xTB universal FF for --xtb-refine
  - openbabel        # obminimize CLI for --obminimize-refine
  - psi4             # optional QM backend for `parametrize -c resp --qm-engine psi4`
  - psiresp          # AMBER-standard 2-stage RESP fit on PSI4 wavefunctions
  - pip
  - pip:
    - propka >=3.5
    - acpype
