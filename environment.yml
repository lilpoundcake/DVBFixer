name: dvbfixer
channels:
  - conda-forge
  - bioconda
  - salilab
dependencies:
  - python >=3.11
  - numpy
  - scipy
  - openmm >=8.1
  - pdbfixer >=1.9
  - openmmforcefields
  - openff-toolkit
  - rdkit
  - biopython
  - mdanalysis
  - modeller
  - parmed
  - plotly
  - hmmer
  - anarci
  - xtb              # GFN-FF/GFN-xTB universal FF for --xtb-refine
  - openbabel        # obminimize CLI for --obminimize-refine
  - pip
  - pip:
    - propka >=3.5
    - acpype
    - pyscf       # QM backend for `parametrize -c resp --qm-engine pyscf`

# Optional: free RESP backend for `parametrize -c resp --qm-engine psi4`.
# psi4 + psiresp ship their own BLAS/MKL stack that conflicts with OpenMM's,
# AND psi4 conda-forge builds pull Python 3.9 which dvbfixer doesn't accept.
# So they live in a SEPARATE conda env; dvbfixer shells out to it via
# `micromamba run -n psi4 python ...`:
#
#   micromamba create -n psi4 -c conda-forge psi4 psiresp
#
# Do NOT pip-install dvbfixer in the psi4 env — dvbfixer stays here and
# invokes the psi4 env on demand. Override env name via --psi4-env.
