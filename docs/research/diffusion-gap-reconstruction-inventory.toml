schema_version = 1
status = "research"
frozen_on = "2026-09-22"
policy_adr = "docs/adr/0010-experimental-diffusion-gap-reconstruction-boundary.md"
implementation_plan = "docs/plans/diffusion-gap-reconstruction.md"

[scope]
input_class = "canonical L-protein"
sequence_sources = ["FASTA", "SEQRES"]
initial_gap_lengths = [3, 12]
requires_two_observed_anchors = true
allows_terminal_gaps = false
allows_multiple_models = false
allows_adjacent_altloc_ambiguity = false
allows_retained_heterogens_near_generated_region = false
allows_external_covalent_links_near_generated_region = false
public_cli_enabled = false
default_backend = "modeller"
automatic_fallback = false

[thresholds]
version = 1
fixed_heavy_atom_rmsd_angstrom_max = 0.01
fixed_heavy_atom_displacement_angstrom_max = 0.03
detectable_d_ca_max = 0
junction_cn_angstrom_min = 1.20
junction_cn_angstrom_max = 1.45
generated_backbone_break_angstrom_max = 1.80
requires_complete_generated_canonical_heavy_atoms = true
requires_all_applicable_explicit_links = true
requires_all_identities_outside_generated_mask = true
requires_no_severe_steric_overlaps = true
same_seed_repeat_rmsd_angstrom_max = 0.01
unsupported_public_pdb_count_max = 0
experimental_median_gap_backbone_rmsd_delta_vs_modeller_angstrom_max = 0.25
requires_junction_pass_rate_at_least_modeller = true
requires_stricter_fixed_coordinate_adherence_than_modeller = true

