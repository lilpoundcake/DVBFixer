schema_version = 1
status = "research"
frozen_on = "2026-09-22"
policy_adr = "docs/adr/0010-experimental-diffusion-gap-reconstruction-boundary.md"
implementation_plan = "docs/plans/diffusion-gap-reconstruction.md"

[scope]
input_class = "canonical L-protein"
sequence_sources = ["FASTA", "SEQRES"]
initial_gap_lengths = [3, 12]
requires_two_observed_anchors = true
allows_terminal_gaps = false
allows_multiple_models = false
allows_adjacent_altloc_ambiguity = false
allows_retained_heterogens_near_generated_region = false
allows_external_covalent_links_near_generated_region = false
public_cli_enabled = false
default_backend = "modeller"
automatic_fallback = false

[thresholds]
version = 2
fixed_heavy_atom_rmsd_angstrom_max = 0.01
fixed_heavy_atom_displacement_angstrom_max = 0.03
detectable_d_ca_max = 0
junction_cn_angstrom_min = 1.20
junction_cn_angstrom_max = 1.45
generated_backbone_break_angstrom_max = 1.80
requires_complete_generated_canonical_heavy_atoms = true
requires_all_applicable_explicit_links = true
requires_all_identities_outside_generated_mask = true
requires_no_severe_steric_overlaps = true
same_seed_repeat_rmsd_angstrom_max = 0.01
unsupported_public_pdb_count_max = 0
experimental_median_gap_backbone_rmsd_delta_vs_modeller_angstrom_max = 0.25
partner_context_backbone_rmsd_angstrom_max = 0.5
partner_context_backbone_displacement_angstrom_max = 2.0
requires_junction_pass_rate_at_least_modeller = true
requires_stricter_fixed_coordinate_adherence_than_modeller = true

[selection_study]
status = "pilot-corpus-expansion"
primary_statistical_unit = "withheld-gap"
pilot_dependence_cluster = "pdb-entry"
confirmatory_dependence_cluster = "sequence-cluster"
paired_backends_required = true
seeds_count_as_independent_units = false
confirmatory_minimum_independence_groups = 180
confirmatory_maximum_independence_groups_after_blinded_reestimation = 300
secondary_endpoint_minimum_both_valid_independence_groups = 30
primary_endpoint = "independent-validation-hard-gate-pass"
secondary_endpoint = "gap-backbone-rmsd-among-valid-candidates"
required_reporting = ["wilson-pass-rate-interval", "paired-pass-rate-difference-interval", "cluster-bootstrap-rmsd-difference-interval", "failure-rate", "complete-per-case-wall-time", "complete-per-case-peak-vram"]
selection_rule = "A backend is ineligible if it violates fixed-coordinate identity, has unresolved request/result mapping, or has unresolved training leakage for the confirmatory cohort. Individual candidate hard-gate failures count against the primary paired pass-rate endpoint rather than disappearing as missing data. Among eligible backends, require a non-inferior paired hard-gate pass rate, then prefer the lowest cluster-bootstrap median gap-backbone RMSD. If RMSD evidence is inconclusive, report runtime and peak VRAM for operational review without automatically selecting a backend."
pilot_limitation = "PDB-entry groups prevent masks from one structure being resampled independently. Sequence clustering across entries is still required before the confirmatory corpus is locked."

[threshold_history.partner_context_v2]
changed_on = "2026-09-24"
previous_backbone_displacement_angstrom_max = 1.5
revised_backbone_displacement_angstrom_max = 2.0
unchanged_backbone_rmsd_angstrom_max = 0.5
triggering_observation = "The first retained-partner 7X35 run passed backbone RMSD at 0.255 Angstrom but failed the 1.5 Angstrom absolute maximum because one of 1008 partner backbone atoms, a non-interface oxygen, moved 1.708 Angstrom. Partner median, p99, and C-alpha maximum displacement were 0.146, 0.841, and 0.523 Angstrom."
rationale = "Retain the global RMSD gate and a finite absolute guard while avoiding rejection from one RFdiffusion oxygen outlier in a large receptor. The initial failure remains recorded; this revision predates any accepted interface candidate."

