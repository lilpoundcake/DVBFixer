[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dvbfixer"
version = "0.7.5"
description = "PDB structure preparation tools: chain splitting, renumbering, loop modeling, fixing, minimization, protonation, topology generation, molecule transplanting"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "biopython",
    "openmm>=8.1",
    "pdbfixer>=1.9",
    "propka>=3.5",
    "MDAnalysis",
    "openmmforcefields",
    "parmed",
    "acpype",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
dvbfixer = "dvbfixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = ["build", "FF", "test", ".dsp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — enforced by formatter, not lint
    "B008",  # allow function calls in argument defaults (argparse patterns)
    "B904",  # raise ... from err — noisy on legacy code
    "UP038", # keep isinstance(x, (a, b)) form; tuple syntax is fine
    # TODO(Phase 3): re-enable these and fix mechanically. Suppressed for the
    # Phase 0 "mechanical ruff --fix" pass so ruff check goes green without
    # touching semantics.
    "B007",  # unused loop var — mostly noise, some are intentional
    "B905",  # zip() without strict= — needs per-call review
    "E741",  # ambiguous var name 'l' / 'I' — sprinkled through legacy code
    "F841",  # unused local var — some may hold side effects; audit before removing
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/dvbfixer"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Strict on the API surface only; expand as Phase 3 lands.
[[tool.mypy.overrides]]
module = [
    "dvbfixer.cli",
    "dvbfixer.ffutils",
    "dvbfixer.pdbutils",
    "dvbfixer.align",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end pipeline tests (minutes each) — opt-in via -m slow",
]
filterwarnings = [
    "ignore::DeprecationWarning:MDAnalysis",
    "ignore::DeprecationWarning:Bio",
]
